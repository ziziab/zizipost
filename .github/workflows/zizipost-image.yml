name: Build ZiziPost image

# Builds the ZiziPost-branded Postiz image and publishes it to
# ghcr.io/<owner>/zizipost (tags: latest and the commit SHA).
on:
  workflow_dispatch:
  push:
    branches: [zizipost]

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Build and push
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          IMAGE=ghcr.io/$OWNER/zizipost
          docker buildx build --platform linux/amd64 \
            -f Dockerfile.dev \
            --build-arg NEXT_PUBLIC_VERSION=v2.25.1-zizipost \
            -t $IMAGE:latest -t $IMAGE:${{ github.sha }} \
            --provenance=false --sbom=false \
            --push .
